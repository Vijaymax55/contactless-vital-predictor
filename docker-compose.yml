version: "3.9"

services:
  # ──────────────────────────────────
  # BluSim Inference API
  # ──────────────────────────────────
  blusim-api:
    build:
      context: .
      target: runtime
    image: blusim:latest
    container_name: blusim-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - blusim-logs:/app/logs
    environment:
      - BLUSIM_DATA_ROOT=/app/data
      - BLUSIM_MODELS_DIR=/app/models
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_ORG=${INFLUXDB_ORG:-blusim}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-vitals}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────
  # InfluxDB time-series database
  # ──────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: blusim-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-blusim_secret}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-blusim}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-vitals}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-blusim-token-change-me}
      - DOCKER_INFLUXDB_INIT_RETENTION=0
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────
  # MLflow experiment tracking (optional)
  # ──────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.0
    container_name: blusim-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/artifacts
    restart: unless-stopped

volumes:
  influxdb-data:
  influxdb-config:
  mlflow-data:
  blusim-logs:
